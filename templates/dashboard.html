<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>NetGuard: case ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono&family=IBM+Plex+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1013;--panel:#151a1f;--line:#2a313a;--tx:#e8e2d6;--mu:#8f8a7e;--bad:#c9663c;--ok:#7d9a6b;--warn:#c9a23c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;max-width:1000px;margin:auto;padding:28px 18px}
h1{font:600 28px 'Fraunces',Georgia,serif;margin:0}.mu{color:var(--mu)}code,td.n{font-family:'IBM Plex Mono',monospace}
.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:14px;flex-wrap:wrap;gap:10px}
.big{font:600 34px 'Fraunces',serif}.bar{display:flex;gap:12px;align-items:center;margin:18px 0;flex-wrap:wrap}
button,input[type=file]::file-selector-button{background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:7px 13px;cursor:pointer;font:inherit}
button:hover{border-color:var(--mu)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:400;border-bottom:1px solid var(--line);padding:6px}
td{padding:6px;border-bottom:1px solid #1d232a}tr.r{cursor:pointer}tr.r:hover{background:var(--panel)}
.A{color:var(--bad)}.N{color:var(--ok)}#why{background:var(--panel);border:1px solid var(--line);padding:14px;margin-top:16px;display:none}
.tag{font-size:12px;color:var(--mu)}</style></head><body>
<div class="head"><div><h1>NetGuard case ledger</h1><div class="mu">Hybrid anomaly + classifier, served model</div></div>
<div id="m" class="mu">loading metrics…</div></div>
<div class="bar"><input type="file" id="f" accept=".csv"><button id="go">Score first 300 rows</button>
<label class="mu"><input type="checkbox" id="only"> flagged only</label><span id="sum" class="mu"></span></div>
<table><thead><tr><th>#</th><th>Verdict</th><th>Type</th><th>Confidence</th><th>Score</th></tr></thead><tbody id="t"></tbody></table>
<div id="why"></div>
<script>
let rows=[];const $=id=>document.getElementById(id);
fetch('/metrics').then(r=>r.json()).then(m=>{if(m.error){$('m').textContent='no metrics: run train.py';return}
const h=m.headline;$('m').innerHTML=`<div class="big">${h.value.toFixed(2)}</div>${h.metric}, 95% CI ${h.ci95[0].toFixed(2)} to ${h.ci95[1].toFixed(2)}`+
(m.suspicious_result?'<div class="A">result looks too good; check for leakage</div>':'')});
function draw(){const o=$('only').checked;$('t').innerHTML=rows.filter(r=>!o||r.verdict=='ANOMALY').map(r=>
`<tr class="r" onclick="why(${r.i})"><td class="n">${r.i}</td><td class="${r.verdict=='ANOMALY'?'A':'N'}">${r.verdict}</td><td>${r.attack_type}</td><td class="n">${(r.confidence*100).toFixed(0)}%</td><td class="n">${r.anomaly_score}</td></tr>`).join('')}
$('go').onclick=async()=>{const f=$('f').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);$('sum').textContent='scoring…';
const r=await fetch('/predict_csv',{method:'POST',body:fd});const d=await r.json();if(d.error){$('sum').textContent=d.error;return}
rows=d.rows;$('sum').textContent=`${d.flagged} of ${d.n} flagged`;$('why').style.display='none';draw()};
$('only').onchange=draw;
async function why(i){const w=$('why');w.style.display='block';w.textContent='…';
const d=await(await fetch('/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flow:rows[i].flow})})).json();
w.innerHTML=`<b>Flow ${i}: why ${d.verdict}?</b><p>${d.explanation}</p><table>`+d.signals.map(s=>
`<tr><td class="n">${s.feature}</td><td class="n">${s.value}</td><td class="mu">normal ≈ ${s.normal_typical}</td><td class="n">${s.z>0?'+':''}${s.z} SD</td></tr>`).join('')+
`</table><div class="tag">source: ${d.source}. A statistical signal from the model, not proof of an attack.</div>`}
</script></body></html>
